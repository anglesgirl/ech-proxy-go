plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.anglesgirl.echbrowser'
    compileSdk 36

    defaultConfig {
        applicationId "com.anglesgirl.echbrowser"
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    splits {
        abi {
            enable false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            packaging {
                jniLibs {
                    // 允许压缩 so 进 APK（否则 libxul.so 150MB 原样 Stored，APK 197MB）
                    // 安装时解压，GeckoView 兼容
                    useLegacyPackaging = true
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // GeckoView 153.03132010：桌面 Firefox 153 实测注入 ECH 能开 x.com；
    // 147 的 ECH 实现疑似不完整（x.com TLS 成功但页面失败）。
    // ⚠️ 不要升 20260810（真机启动即 native crash）
    implementation "org.mozilla.geckoview:geckoview:153.0.20260803132010"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
