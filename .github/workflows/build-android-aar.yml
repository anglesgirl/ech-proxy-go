name: Build ech-android AAR

on:
  push:
    paths:
      - '.github/workflows/build-android-aar.yml'
      - 'mobile/ech-android/**'
      - 'mobile/echproxy/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Build Go core AAR (echproxy.aar)
        run: |
          cd mobile/ech-android
          mkdir -p libs
          gomobile bind -target=android -androidapi 27 -o libs/echproxy.aar ../echproxy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android SDK AARs
        run: |
          cd mobile/ech-android
          bash ./build-android-aar.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ech-android-sdk-aar
          path: |
            mobile/ech-android/ech-android.aar
            mobile/ech-android/libs/echproxy.aar

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=416651575" \
            -d "text=❌ ech-android AAR 构建失败%0A仓库: ${{ github.repository }}%0A分支: ${{ github.ref_name }}%0A提交: ${{ github.sha }}%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
