name: Build ech-android AAR

on:
  push:
    paths:
      - 'mobile/ech-android/**'
      - 'mobile/echproxy/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Build Go core AAR (echproxy.aar)
        run: |
          cd mobile/ech-android
          gomobile bind -target=android -androidapi 27 -o libs/echproxy.aar ../echproxy

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build ech-android AAR
        run: |
          cd mobile/ech-android
          chmod +x ./gradlew 2>/dev/null || true
          ./build-android-aar.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ech-android-aar
          path: mobile/ech-android/ech-android.aar
