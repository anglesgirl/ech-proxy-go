name: Build AAR

on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/echproxy/**'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Initialize gomobile
        run: gomobile init

      - name: Build AAR
        run: |
          gomobile bind -target=android -androidapi 27 -o echproxy-arm64-v8a.aar ./mobile/echproxy

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: echproxy-aar
          path: echproxy-arm64-v8a.aar

      - name: Release AAR to echproxy-latest tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echproxy-latest
          name: echproxy AAR (auto)
          body: Auto-released from commit ${{ github.sha }}
          files: echproxy-arm64-v8a.aar
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}